server:
  port: 8080
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: collab-editor-server
  # 数据库连接（凭据不落 git：本地用 application-local.yml override）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/collab_editor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: 168

logging:
  level:
    com.bishe: INFO
