<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>协同演示台（T0+3 实时层）</title>
<script src="/auth.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f7f8fa; }
  h1 { font-size: 20px; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 6px 14px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
  button:disabled { background: #b7c6e8; }
  #status { font-size: 13px; color: #555; }
  #log { font-size: 12px; color: #666; white-space: pre-wrap; max-height: 90px; overflow: auto; margin-top: 6px; }
  textarea { width: 100%; height: 260px; font: 15px/1.6 "Microsoft YaHei", monospace; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; resize: vertical; }
  .tip { font-size: 13px; color: #888; }
</style>
</head>
<body>
<h1>多人实时协同编辑 · 实时层演示</h1>
<div class="bar">
  <label>文档 <input id="docId" value="demo-doc-1" style="width:110px" /></label>
  <label>昵称 <input id="nick" value="窗口" style="width:70px" /></label>
  <button id="connect">连接</button>
  <button id="clear" disabled>清空文档</button>
  <span id="status">未连接</span>
</div>
<div id="log"></div>
<textarea id="editor" placeholder="连接后在这里输入……（打开两个标签页即可看到实时同步）" disabled></textarea>
<div class="tip">每次输入停顿 500ms 自动提交全量文本字段（占位协议，T0+5 换成段落级元素）；断开后带 lastRev 重连可补发增量。</div>

<script>
const $ = (id) => document.getElementById(id);
let ws = null, docId = 'demo-doc-1', rev = 0, me = 'w' + Math.random().toString(36).slice(2, 7);
let editing = false, sendTimer = null, lastLocal = '';

function status(s) { $('status').textContent = s; }
function log(s) {
  const el = $('log');
  el.textContent += (el.textContent ? '\n' : '') + s;
  el.scrollTop = el.scrollHeight;
}

function connect() {
  if (!window.auth.token()) { location.href = '/login.html'; return; }
  docId = $('docId').value.trim() || 'demo-doc-1';
  me = $('nick').value.trim() || 'w' + Math.random().toString(36).slice(2, 7) + '-' + Math.random().toString(36).slice(0, 3);
  $('connect').disabled = true; $('clear').disabled = false; $('editor').disabled = false;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(window.auth.wsUrl('/ws/collab'));
  ws.onopen = () => {
    // 断线重连：带 lastRev —— 服务端补发错过的操作（增量同步）
    ws.send(JSON.stringify({ type: 'hello', docId, clientId: me, hostname: me, lastRev: rev }));
    status('连接中…');
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    switch (m.type) {
      case 'welcome':
        rev = m.rev;
        const text = (m.snapshot.find(e => e.id === 'doc-1') || {}).fields;
        editing = true;
        if (text) $('editor').value = text.text.value; else $('editor').value = '';
        editing = false;
        lastLocal = $('editor').value;
        status(`已连接（rev=${rev}，在场 ${m.snapshot.length}）`);
        log(`[欢迎] ${m.clientId} doc=${docId} rev=${rev}`);
        break;
      case 'incremental':
        m.ops.forEach(o => { rev++; applyRemote(o); });
        status(`增量补发 ${m.ops.length} 条 → rev=${rev}`);
        log(`[增量] +${m.ops.length} ops → rev=${rev}`);
        break;
      case 'applied':
        rev = m.rev;
        if (m.op.elementId !== 'doc-1') break;
        if (m.op.type === 'DELETE') {
          $('editor').value = '';
          lastLocal = '';
          break;
        }
        applyRemote(m.op);
        break;
      case 'presence':
        status(`在线：${m.clients.join('、')}｜rev=${rev}`);
        break;
      case 'error':
        log('[错误] ' + m.message);
        break;
    }
  };
  ws.onclose = () => {
    status('连接断开，1.5s 后自动重连（带 lastRev 增量续传）…');
    setTimeout(connect, 1500);
  };
  ws.onerror = () => log('[ws] error');
}

// 远端 op 落到文本域（简单字段覆盖；非本地输入才落库）
function applyOp(op) {
  editing = true;
  if (op.field === 'text' && typeof op.value === 'string') {
    if ($('editor').value === op.value) { editing = false; return; }
    const el = $(op.elementId === 'doc-1' ? 'tb' : 'tb');
    el.value = op.value;
    lastLocal = op.value;
  }
  editing = false;
}

$('editor').addEventListener('input', () => {
  if (editing) return;
  clearTimeout(sendTimer);
  const v = $('editor').value;
  if (v === lastLocal) return;
  sendTimer = setTimeout(sendText, 500, v);
});

function sendText(text /* 差量提交文本 */) {
  // 简化：整段覆盖文本字段（T0+5 换段落级 op 前后缀 diff）
  const op = { type: 'PUT', elementId: 'doc-1', elementType: 'TEXT', field: 'text', value: text, clock: '' };
  sendOp(op);
}

let clockC = 0;
function sendOp(op) {
  op.clock = `${me}:${++clockC}`;
  ws.send(JSON.stringify({ type: 'op', op }));
  lastLocal = $('editor').value;
}

$('clear').onclick = () => {
  const op = { type: 'PUT', elementId: 'doc-1', elementType: 'TEXT', field: 'text', value: '' };
  sendOp(op);
};

connect();
</script>
</body>
</html>
