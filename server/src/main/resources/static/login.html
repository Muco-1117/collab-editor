<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>登录 · 协同工作台</title>
<script src="/auth.js"></script>
<style>
  :root {
    --bg:#f7f6f3; --card:#ffffff; --line:rgba(20,18,14,.09); --ink:rgba(30,27,24,.92);
    --mut:#6f6960; --mutl:#a39e96; --acc:#0a6cda; --acc2:#005bb5;
    --deep: rgba(30,27,20,.02) 0px 1px 3px, rgba(30,27,20,.03) 0px 3px 7px,
            rgba(30,27,20,.05) 0px 7px 15px, rgba(30,27,20,.08) 0px 14px 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background: var(--bg); color: var(--ink); min-height: 100vh; display: flex;
         flex-direction: column; align-items: center; justify-content: center;
         -webkit-font-smoothing: antialiased; }
  .brand { position:absolute; top:22px; left:26px; display:flex; align-items:center; gap:9px;
           font-size:15px; font-weight:700; letter-spacing:-.2px; }
  .brand .logo { width:30px; height:30px; border-radius:8px; background:var(--acc); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .brand a { color:var(--mut); font-weight:400; font-size:13px; text-decoration:none; margin-left:6px; }
  .brand a:hover { color:var(--acc); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
         padding: 38px 34px 30px; width: 356px; box-shadow: var(--deep); }
  .box .logo-l { width:44px; height:44px; border-radius:12px; background:var(--acc); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700;
      margin: 0 auto 16px; }
  h1 { font-size: 21px; text-align: center; margin-bottom: 6px; letter-spacing:-.4px; }
  .sub { text-align: center; color: var(--mut); font-size: 13.5px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--mut); margin: 14px 0 5px; font-weight:500; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
          font-size: 14px; outline: none; background:#fff; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(10,108,218,.14); }
  .btn { display: block; width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 8px;
         background: var(--acc); color: #fff; font-size: 15px; font-weight:600; cursor: pointer;
         transition: background .15s, transform .1s; }
  .btn:hover { background: #095db8; }
  .btn:active { transform: scale(.98); }
  .tip { text-align: center; margin-top: 16px; font-size: 13px; color: var(--mut); }
  .tip a { color: var(--acc); cursor: pointer; text-decoration: none; font-weight:600; }
  .tip a:hover { text-decoration: underline; }
  .err { color: #d93026; font-size: 13px; margin-top: 12px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <div class="brand"><span class="logo">协</span>协同工作台<a href="/">← 返回首页</a></div>
  <div class="box card">
    <div class="logo-l">协</div>
    <h1>协同工作台</h1>
    <div class="sub">登录后进入 文档 / 白板 / 看板，与成员实时协作</div>
    <form id="form">
      <label>用户名</label>
      <input id="username" autocomplete="username" required>
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <label id="nickLabel" style="display:none">昵称（可选）</label>
      <input id="nickname" style="display:none" autocomplete="nickname">
      <button class="btn" id="submitBtn" type="submit">登 录</button>
    </form>
    <div class="err" id="err"></div>
    <div class="tip"><span id="switchText">没有账号？</span><a id="switch" href="javascript:void(0)">注册一个</a></div>
  </div>
<script>
  if (window.auth && window.auth.token()) { location.replace('/'); }
  const isReg = { v: false };
  const $ = id => document.getElementById(id);

  $('switch').onclick = () => {
    isReg.v = !isReg.v;
    $('nickLabel').style.display = isReg.v ? '' : 'none';
    $('nickname').style.display = isReg.v ? '' : 'none';
    $('submitBtn').textContent = isReg.v ? '注 册' : '登 录';
    $('switchText').textContent = isReg.v ? '已有账号？' : '没有账号？';
    $('switch').textContent = isReg.v ? '去登录' : '注册一个';
  };

  $('form').onsubmit = async ev => {
    ev.preventDefault();
    const u = $('username').value.trim(), p = $('password').value;
    const nick = $('nickname').value.trim();
    $('err').textContent = '';
    const path = isReg.v ? '/api/auth/register' : '/api/auth/login';
    const body = isReg.v ? JSON.stringify({ username: u, password: p, nickname: nick })
                          : JSON.stringify({ username: u, password: p });
    try {
      const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const j = await r.json();
      if (!r.ok) { $('err').textContent = j.msg || '请求失败'; return; }
      window.auth.save(j.token, j.user);
      location.href = '/';
    } catch { $('err').textContent = '网络错误，请确认服务已启动'; }
  };
</script>
</body>
</html>
