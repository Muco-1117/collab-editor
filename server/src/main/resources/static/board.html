<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>协同工作台 · 白板</title>
<script src="/auth.js"></script>
<style>
  :root {
    --bg:#f7f6f3; --card:#ffffff; --line:rgba(20,18,14,.09);
    --ink:rgba(30,27,24,.92); --mut:#6f6960; --mutl:#a39e96;
    --acc:#0a6cda; --acc2:#0059b5; --accbg:#f2f8ff; --ok:#1e9e58;
    --shadow: rgba(30,27,20,.05) 0px 4px 18px, rgba(30,27,20,.035) 0px 2px 7.8px,
              rgba(30,27,20,.025) 0px .8px 2.9px, rgba(30,27,20,.02) 0px .2px 1px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
           padding:9px 20px; background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
           border-bottom:1px solid var(--line); }
  header .brand { display:flex; align-items:center; gap:8px; margin-right:6px; }
  header .brand .logo { width:26px; height:26px; border-radius:7px; background:var(--acc); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  header .brand a { color:var(--mut); text-decoration:none; font-size:12.5px; margin-left:2px; }
  header .brand a:hover { color:var(--acc); }
  header h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:-.2px; }
  .tag { font-size:12.5px; color:var(--mut); }
  .btn { border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 12px;
         cursor:pointer; font-size:13px; transition:all .15s; color:var(--ink); }
  .btn:hover { border-color:var(--acc); color:var(--acc); }
  .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .btn.primary:hover { background:var(--acc2); color:#fff; }
  #wrap { display:flex; height:calc(100vh - 49px); }
  #side { width:264px; border-right:1px solid var(--line); background:var(--card);
          overflow:auto; padding:14px; }
  #side h2 { font-size:12px; color:var(--mutl); margin:0 0 8px; font-weight:600; letter-spacing:.4px; }
  .doc-item { padding:7px 10px; border-radius:7px; cursor:pointer; display:flex;
              justify-content:space-between; align-items:center; gap:6px; font-size:13.5px; }
  .doc-item:hover { background:var(--bg); }
  .doc-item.active { background:var(--accbg); color:var(--acc); font-weight:600; }
  .doc-item .del { visibility:hidden; border:0; background:none; color:var(--mutl);
                   cursor:pointer; font-size:15px; padding:0 2px; }
  .doc-item:hover .del { visibility:visible; }
  .doc-item .del:hover { color:#e5484d; }
  .doc-empty { color:var(--mutl); font-size:12.5px; line-height:1.7; padding:4px 10px; }
  #boardWrap { flex:1; min-width:0; position:relative; overflow:auto; display:flex; }
  #boardRoot { min-height:0; display:flex; }
  #board { position:relative; transform-origin:0 0;
           background:radial-gradient(circle, rgba(30,27,20,.13) 1px, transparent 1px) 0 0/22px 22px; }
  .card { position:absolute; min-width:90px; min-height:56px; background:var(--card);
          border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
          padding:26px 10px 10px; cursor:grab; user-select:none; }
  .card.drag { cursor:grabbing; box-shadow:var(--deep, 0 10px 24px rgba(20,30,60,.22)); z-index:10; }
  .card .body { outline:none; white-space:pre-wrap; word-break:break-all; min-height:1em; font-size:14px; }
  .card .body:empty::before { content:'（双击输入文字）'; color:var(--mutl); }
  .card .del { position:absolute; top:5px; right:7px; border:0; background:none; color:#b9c0cd;
               font-size:14px; cursor:pointer; padding:0 3px; line-height:1; }
  .card:hover .del, .card .del:hover { color:#e5484d; }
  .card .resize { position:absolute; right:2px; bottom:2px; width:14px; height:14px; cursor:nwse-resize;
                  background:linear-gradient(135deg, transparent 45%, #b7bfcb 45%, #b7bfcb 60%, transparent 60%); }
  .card .owner { position:absolute; left:7px; top:4px; font-size:10px; color:#b7bfcb; }
  #status { position:fixed; right:16px; bottom:12px; font-size:12px; color:var(--mut);
           background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:999px;
           padding:5px 12px; box-shadow:var(--shadow); }
  #log { position:fixed; left:16px; bottom:12px; font-size:11px; color:#98938b; max-width:420px;
         max-height:64px; overflow:auto; background:rgba(255,255,255,.93); border:1px solid var(--line);
         border-radius:9px; padding:4px 10px; display:none; }
  #hint { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); text-align:center;
          color:#a39e96; pointer-events:none; display:none; }
  #hint b { display:block; font-size:15px; margin-bottom:6px; color:#8a837a; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.on { background:var(--ok); } .dot.off { background:#e5484d; }

  /* —— 左侧工作台导航栏 —— */
  .rail { position:fixed; inset:0 auto 0 0; width:56px; background:#1c1917; z-index:60;
          display:flex; flex-direction:column; align-items:center; padding:12px 0 14px; }
  .rail .rlogo { width:34px; height:34px; border-radius:10px; background:var(--acc); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;
      margin-bottom:14px; box-shadow:0 2px 8px rgba(10,108,218,.4); }
  .rail a { width:38px; height:38px; border-radius:10px; display:flex; align-items:center;
      justify-content:center; color:#9b958d; text-decoration:none; margin:2px 0;
      transition:all .15s; position:relative; }
  .rail a:hover { background:rgba(255,255,255,.09); color:#fff; }
  .rail a.active { background:rgba(10,108,218,.25); color:#fff; }
  .rail a.active::before { content:''; position:absolute; left:-9px; top:9px; bottom:9px;
      width:3px; border-radius:3px; background:var(--acc); }
  .rail a .tip { position:absolute; left:52px; top:50%; transform:translateY(-50%);
      background:#1c1919; color:#e8e6e2; font-size:12px; padding:4px 10px; border-radius:6px;
      white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s; z-index:99;
      box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .rail a:hover .tip { opacity:1; }
  .rail .ruser { margin-top:auto; }
  main.rail-body { margin-left:56px; display:block; }

  /* —— 在线成员头像群 —— */
  .who { display:flex; align-items:center; }
  .who-avatar { width:26px; height:26px; border-radius:50%; color:#fff; font-size:11.5px;
      font-weight:600; display:flex; align-items:center; justify-content:center;
      margin-left:-7px; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.12);
      flex:none; }
  .who-avatar:first-child { margin-left:0; }
  .who-caption { font-size:11.5px; color:var(--mutl); margin-left:8px; }
  /* —— 白板工具栏 / 缩放 / 上色 / 右键菜单 —— */
  #boardWrap { display:flex; flex-direction:column; }
  .toolbar { position:sticky; top:10px; z-index:50; margin:0 12px 0 auto; width:max-content;
    display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:5px 8px; box-shadow:0 4px 18px rgba(0,0,0,.10); font-size:12px; color:var(--mut); }
  .toolbar button { border:0; background:transparent; font-size:13px; line-height:1; padding:5px 7px;
    border-radius:6px; cursor:pointer; color:var(--ink); }
  .toolbar button:hover { background:var(--bg); }
  .toolbar .zl { min-width:44px; text-align:center; font-variant-numeric:tabular-nums; font-size:12px; font-weight:600; }
  .toolbar .sep { width:1px; height:18px; background:var(--line); align-self:stretch; margin:2px 2px; }
  .swatches { display:flex; gap:5px; align-items:center; }
  .swatch { width:17px; height:17px; border-radius:50%; border:1.5px solid rgba(0,0,0,.12);
    cursor:pointer; flex:none; box-sizing:border-box; }
  .swatch:hover { transform:scale(1.18); border-color:rgba(0,0,0,.3); }
  #zoomHint { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:300;
    background:rgba(28,26,22,.92); color:#fff; border-radius:8px; padding:7px 14px; font-size:12.5px;
    box-shadow:0 6px 24px rgba(0,0,0,.25); display:none; }
  .card.sel { outline:2px solid var(--acc); outline-offset:1px; }
  .ctx { position:fixed; z-index:400; width:max-content; background:var(--card); border:1px solid var(--line);
    border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.22); padding:7px; min-width:156px;
    animation:rmpop .12s ease; font-size:12.5px; color:var(--ink); }
  .ctx .ctx-title { font-size:11px; color:var(--mut); padding:2px 8px 5px; font-weight:600; }
  .ctx .swatches { padding:3px 8px 7px; display:flex; gap:5px; }
  .ctx hr { border:0; border-top:1px solid var(--line); margin:4px 2px; }
  .ctx .ctx-item { padding:7px 8px; border-radius:6px; cursor:pointer; }
  .ctx .ctx-item:hover { background:var(--bg); }
  .ctx .ctx-item.danger { color:#e5484d; }
</style>
</head>
<body>
<div class="rail">
  <span class="rlogo">协</span>
  <a href="/"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h5v-6h4v6h5V9.7"/></svg><span class="tip">工作台</span></a>
  <a href="/editor.html" ><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg><span class="tip">协同文档</span></a>
  <a href="/board.html" class="active"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg><span class="tip">协同白板</span></a>
  <a href="/kanban.html" ><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5.2" height="18" rx="1.6"/><rect x="9.4" y="3" width="5.2" height="11" rx="1.6"/><rect x="15.8" y="3" width="5.2" height="15" rx="1.6"/></svg><span class="tip">协同看板</span></a>
  <a class="ruser" id="railUser" href="/login.html"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="tip">账号</span></a>
</div>
<main class="rail-body"><header>
  <h1>协同白板</h1>
  <button class="btn primary" onclick="newBoard()">＋ 新建白板</button>
  <button class="btn" onclick="showHistory()">📜 历史</button>
  <span id="who" class="who" title="在线成员"></span>
  <span class="tag" id="meTag" style="margin-left:auto"></span>
</header>
<div id="wrap">
<aside id="side">
  <h2>白板文档</h2>
  <div id="docList"></div>
</aside>
<div id="boardWrap">
  <div id="board">
    <div id="hint"><b>双击空白处新建卡片</b>拖动卡片 · 右下角缩放 · 右上角 ✕ 删除 · 双击文字区域编辑</div>
  </div>
  <div class="toolbar">
    <button onclick="zoomStep(-0.1)" title="缩小">−</button>
    <span class="zl" id="zoomLabel">100%</span>
    <button onclick="zoomStep(0.1)" title="放大">＋</button>
    <button onclick="zoomSet(1,1)" title="恢复到 100%">100%</button>
    <button onclick="zoomFit()" title="适配全部卡片">⤢ 适配</button>
    <span class="sep"></span>
    <span class="swatches" id="swBar" title="先点选卡片，再点颜色"></span>
  </div>
  <div id="zoomHint"></div>
</div>
</div>
<div id="status"><span class="dot off" id="dot"></span><span id="statText">未连接</span></div>
<div id="log"></div>

<script>
'use strict';
window.auth.guard();
/* REST 统一带 token */
const api = (url, opt = {}) => fetch(url, {
  ...opt,
  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + window.auth.token(), ...(opt.headers || {}) },
});
const me = 'b' + Math.random().toString(36).slice(2, 9);
let ws = null, rev = 0, curDoc = null, lamport = 0;
const cards = new Map();                        // eid -> {el, dragging, resizing}
const $ = id => document.getElementById(id);
const clock = () => `${me}:${++lamport}`;
const log = s => { $('log').style.display='block'; $('log').textContent += '> ' + s + '\n'; $('log').scrollTop=1e9; };
const stat = t => $('statText').textContent = t;
const setDot = on => $('dot').className = 'dot ' + (on ? 'on' : 'off');


/* 在线成员头像群 */
const whoEls = new Map();
function whoColor(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 'hsl(' + (h % 360) + ' 62% 46%)'; }
function renderWho(clients) {
  const box = $('who'); if (!box) return;
  const set = new Set(clients || []);
  whoEls.forEach((el, id) => { if (!set.has(id)) { el.remove(); whoEls.delete(id); } });
  set.forEach(id => {
    if (!whoEls.has(id)) {
      const s = document.createElement('span');
      s.className = 'who-avatar';
      s.textContent = (id === me ? '我' : String(id || '?').slice(0, 1).toUpperCase());
      s.title = (id === me ? '我' : '成员 ' + id.slice(0, 12));
      s.style.background = whoColor(id);
      whoEls.set(id, s);
      box.appendChild(s);
    }
  });
  let cap = box.querySelector('.who-caption');
  if (!cap) { cap = document.createElement('span'); cap.className = 'who-caption'; box.appendChild(cap); }
  cap.textContent = set.size ? set.size + ' 人在线' : '';
}
/* ============ WS ============ */
function connect(docKey) {
  if (!docKey) return;
  if (ws) { ws.onclose = null; ws.close(); }
  curDoc = docKey;
  rev = 0;
  cards.forEach(r => r.el.remove()); cards.clear();
  $('hint').style.display = 'block';
  ws = new WebSocket(window.auth.wsUrl('/ws/collab'));
  ws.onopen = () => send({ type:'hello', docId:curDoc, clientId:me, hostname:'board', lastRev:0 });
  ws.onmessage = ev => { try { onMsg(JSON.parse(ev.data)); } catch(e){ log('坏帧'); } };
  ws.onclose = () => setDot(false);
  ws.onerror = () => log('连接错误');
}
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const sendPut = (eid, field, value) => send({ type:'op', docId:curDoc, clientId:me, baseRev:rev,
  op:{ type:'PUT', elementId:eid, elementType:'CARD', field, value, clock:clock() } });
const sendCardOp = op => send({ type:'op', docId:curDoc, clientId:me, baseRev:rev, op });

function onMsg(m) {
  switch (m.type) {
    case 'welcome': setDot(true); render(m.snapshot||[]); rev = m.rev; stat('已连接 rev=' + rev); break;
    case 'incremental': (m.ops||[]).forEach(o => applyRemote(o)); rev = m.rev; stat('增量补发'); break;
    case 'applied':
      rev = m.rev;
      // 自己的 op 也做本地镜像（DELETE 本地移除；PUT/ADD 幂等）
      applyRemote(m.op);
      break;
    case 'presence': stat('rev=' + rev + ' · 在线 ' + ((m.clients||[]).length) + ' 人'); renderWho(m.clients||[]); break;
  }
}

/* ============ 渲染 ============ */
function render(snap) {
  (snap||[]).forEach(el => {
    if (el.type === 'CARD') ensureCard(el.id, unwrap(el.fields||{}));
  });
  $('hint').style.display = cards.size ? 'none' : 'block';
  refreshBoard();
}
function unwrap(fields) {
  const out = {};
  Object.entries(fields).forEach(([k,v]) => { out[k] = v && typeof v === 'object' && 'value' in v ? v.value : v; });
  return out;
}
function ensureCard(eid, f) {
  let rec = cards.get(eid);
  if (!rec) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.eid = eid;
    const c = document.createElement('div');
    c.className = 'body'; c.contentEditable = true; c.spellcheck = false;
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = '删除卡片';
    const tg = document.createElement('span'); tg.className = 'owner';
    const rz = document.createElement('div'); rz.className = 'resize';
    el.append(tg, c, del, rz);
    bindCard(el, c, del, rz);
    el.oncontextmenu = ev => cardMenu(ev, eid);
    $('board').appendChild(el);
    rec = { el, dragging:false, resizing:false };
    cards.set(eid, rec);
  }
  applyFields(eid, f, true);
  return rec;
}
function applyFields(eid, f, init) {
  const rec = cards.get(eid);
  if (!rec) return;
  const el = rec.el;
  if (f.x != null) el.style.left = f.x + 'px';
  if (f.y != null) el.style.top = f.y + 'px';
  if (f.w != null) el.style.width = f.w + 'px';
  if (f.h != null) el.style.height = f.h + 'px';
  const c = el.querySelector('.body');
  if (f.text != null && document.activeElement !== c && c.textContent !== String(f.text)) {
    c.textContent = String(f.text);
  }
  if (f.owner != null) el.querySelector('.owner').textContent = String(f.owner);
  if (f.color != null) el.style.background = f.color;
}

/* ============ 卡片交互 ============ */
function bindCard(el, c, del, rz) {
  del.onclick = () => sendCardOp({ type:'DELETE', elementId:el.dataset.eid, elementType:'CARD', clock:clock() });
  c.addEventListener('input', () => {
    clearTimeout(c._t);
    c._t = setTimeout(() => sendPut(el.dataset.eid, 'text', c.textContent), 250);
  });
  c.addEventListener('mousedown', ev => ev.stopPropagation());
  del.addEventListener('mousedown', ev => ev.stopPropagation());
  rz.addEventListener('mousedown', ev => ev.stopPropagation());
  /* 拖拽（点击卡片本体） */
  el.addEventListener('mousedown', ev => {
    if (ev.target !== el) return;
    ev.preventDefault();
    setSel(el.dataset.eid);
    const rec = cards.get(el.dataset.eid);
    if (!rec || rec.dragging || rec.resizing) return;
    rec.dragging = true;
    el.classList.add('drag');
    const sx = ev.clientX, sy = ev.clientY;
    const ox = parseFloat(el.style.left)||0, oy = parseFloat(el.style.top)||0;
    let last = 0;
    const mv = ev2 => {
      const nx = Math.max(0, ox + (ev2.clientX - sx) / zoomZ);
      const ny = Math.max(0, oy + (ev2.clientY - sy) / zoomZ);
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
      const now = Date.now();
      if (now - last > 90) { last = now; sendPut(el.dataset.eid, 'x', Math.round(nx)); sendPut(el.dataset.eid, 'y', Math.round(ny)); }
    };
    const up = () => {
      rec.dragging = false;
      el.classList.remove('drag');
      sendPut(el.dataset.eid, 'x', Math.round(parseFloat(el.style.left)||0));
      sendPut(el.dataset.eid, 'y', Math.round(parseFloat(el.style.top)||0));
      window.removeEventListener('mousemove', mv);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', up);
  });
  /* 缩放（右下角手柄） */
  rz.addEventListener('mousedown', ev => {
    ev.stopPropagation();
    const rec = cards.get(el.dataset.eid);
    if (!rec || rec.resizing || rec.dragging) return;
    rec.resizing = true;
    el.classList.add('drag');
    const sx = ev.clientX, sy = ev.clientY;
    const ow = parseFloat(el.style.width)||170, oh = parseFloat(el.style.height)||110;
    let last = 0;
    const mv = ev2 => {
      const nw = Math.max(90, ow + (ev2.clientX - sx) / zoomZ);
      const nh = Math.max(56, oh + (ev2.clientY - sy) / zoomZ);
      el.style.width = nw + 'px'; el.style.height = nh + 'px';
      const now = Date.now();
      if (now - last > 90) { last = now; sendPut(el.dataset.eid, 'w', Math.round(nw)); sendPut(el.dataset.eid, 'h', Math.round(nh)); }
    };
    const up = () => {
      rec.resizing = false;
      el.classList.remove('drag');
      sendPut(el.dataset.eid, 'w', Math.round(parseFloat(el.style.width)||170));
      sendPut(el.dataset.eid, 'h', Math.round(parseFloat(el.style.height)||110));
      window.removeEventListener('mousemove', mv);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', up);
  });
}

/* 双击空白新建卡片 */
$('board').addEventListener('dblclick', ev => {
  if (ev.target !== $('board')) return;
  const r = $('board').getBoundingClientRect();
  const eid = 'card-' + Math.random().toString(36).slice(2, 10);
  const x = Math.max(0, Math.round((ev.clientX - r.left) / zoomZ - 85));
  const y = Math.max(0, Math.round((ev.clientY - r.top) / zoomZ - 30));
  sendCardOp({ type:'ADD', elementId:eid, elementType:'CARD', clock:clock() });
  sendPut(eid, 'x', x);
  sendPut(eid, 'y', y);
  sendPut(eid, 'w', 170);
  sendPut(eid, 'h', 110);
  const rec = ensureCard(eid, { x, y, w:170, h:110, text:'' });
  $('hint').style.display = 'none';
  rec.el.querySelector('.body').focus();
});

/* ============ 工具栏 / 缩放 / 上色 / 右键菜单 ============ */
const PALETTE = ['#ffffff', '#ffd666', '#ff9d8f', '#a8d0ff', '#8de3a5', '#d4a9ff', '#ffb3d4', '#c8cbc3'];
let zoomZ = 1, selEid = null;
(function () {
  const bar = document.getElementById('swBar');
  if (bar) PALETTE.forEach(c => {
    const s = document.createElement('span');
    s.className = 'swatch';
    s.style.background = c;
    s.title = c === '#ffffff' ? '重置为白色' : '上色 ' + c;
    s.onclick = () => putColor(c);
    bar.appendChild(s);
  });
})();
function zoomSet(z, center) {
  zoomZ = Math.max(0.2, Math.min(3, +(+z).toFixed(2)));
  const wrap = $('boardWrap'), b = $('board');
  if (wrap && b) {
    b.style.width = Math.max(200, wrap.clientWidth / zoomZ) + 'px';
    b.style.height = Math.max(160, wrap.clientHeight / zoomZ) + 'px';
    b.style.transform = 'scale(' + zoomZ + ')';
  }
  const lb = $('zoomLabel');
  if (lb) lb.textContent = Math.round(zoomZ * 100) + '%';
  if (center && wrap) {
    wrap.scrollLeft = Math.max(0, (wrap.clientWidth * zoomZ - wrap.clientWidth) / 2);
    wrap.scrollTop = Math.max(0, (wrap.clientHeight * zoomZ - wrap.clientHeight) / 2);
  }
}
function zoomStep(d) { zoomSet(zoomZ + d); }
function zoomFit() {
  if (!cards.size) { zoomSet(1); return; }
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  cards.forEach(r => {
    const el = r.el;
    const X = parseFloat(el.style.left) || 0, Y = parseFloat(el.style.top) || 0;
    const W = parseFloat(el.style.width) || 170, H = parseFloat(el.style.height) || 110;
    x1 = Math.min(x1, X); y1 = Math.min(y1, Y); x2 = Math.max(x2, X + W); y2 = Math.max(y2, Y + H);
  });
  const wrap = $('boardWrap');
  const z = Math.min(wrap.clientWidth / (x2 - x1 + 90), wrap.clientHeight / (y2 - y1 + 90), 1.6);
  zoomSet(Math.max(0.2, z), true);
}
function setSel(eid) {
  selEid = eid || null;
  document.querySelectorAll('#board .card.sel').forEach(x => x.classList.remove('sel'));
  const rec = eid && cards.get(eid);
  if (rec) rec.el.classList.add('sel');
}
function hint(msg) {
  const h = $('zoomHint');
  if (!h) return;
  h.textContent = msg;
  h.style.display = 'block';
  clearTimeout(h._t);
  h._t = setTimeout(() => { h.style.display = 'none'; }, 1700);
}
function putColor(c) {
  if (!selEid) { hint('先点选画布上的一张卡片，再点颜色'); return; }
  applyFields(selEid, { color: c });
  sendPut(selEid, 'color', c);
  hint(c === '#ffffff' ? '已重置为白色，并同步给在线成员' : '已上色，并同步给在线成员');
}
function cardMenu(e, eid) {
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.ctx').forEach(x => x.remove());
  const m = document.createElement('div');
  m.className = 'ctx';
  m.style.left = Math.max(6, Math.min(e.clientX, innerWidth - 178)) + 'px';
  m.style.top = Math.max(6, Math.min(e.clientY, innerHeight - 215)) + 'px';
  m.innerHTML = '<div class="ctx-title">卡片颜色</div><div class="swatches">'
    + PALETTE.map(c => '<span class="swatch" data-c="' + c + '" style="background:' + c + '"></span>').join('')
    + '</div><hr><div class="ctx-item danger">删除卡片</div>';
  const close = () => { m.remove(); document.removeEventListener('click', close, true); document.removeEventListener('contextmenu', close, true); };
  m.querySelectorAll('.swatch').forEach(s => s.onclick = ev => {
    ev.stopPropagation();
    const c = s.getAttribute('data-c');
    applyFields(eid, { color: c });
    sendPut(eid, 'color', c);
    close();
  });
  m.querySelector('.ctx-item').onclick = () => {
    const r = cards.get(eid);
    if (r) { r.el.remove(); cards.delete(eid); }
    sendCardOp({ type: 'DELETE', elementId: eid, elementType: 'CARD', clock: clock() });
    close();
  };
  document.addEventListener('click', close, true);
  document.addEventListener('contextmenu', close, true);
  document.body.appendChild(m);
}
$('boardWrap').addEventListener('wheel', ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  zoomStep(ev.deltaY < 0 ? 0.08 : -0.08);
}, { passive: false });

/* ============ 远端 ============ */
function applyRemote(op) {
  const eid = op.elementId;
  if (op.type === 'DELETE') { const s = cards.get(eid); if (s) { s.el.remove(); cards.delete(eid); } return; }
  if (op.type === 'ADD') { if (op.elementType === 'CARD') { ensureCard(eid, {}); $('hint').style.display='none'; } return; }
  if (op.type === 'PUT') {
    const rec = cards.get(eid);
    if (!rec) return;
    if (rec.dragging || rec.resizing) return;   // 本地拖动中：远端旧时钟值不回跳
    const f = {}; f[op.field] = op.value;
    applyFields(eid, f, false);
  }
}

/* ============ 白板列表 ============ */
async function refreshBoard() {
  try {
    const sp = sessionStorage.getItem('collab_space');
    const url = sp ? '/api/docs?spaceId=' + sp + '&kind=board' : '/api/docs?kind=board';
    const list = await (await api(url)).json();
    const lst = $('docList');
    lst.innerHTML = '';
    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'doc-empty';
      e.textContent = '还没有白板\n点上方「新建白板」，或直接打开别人的邀请链接';
      lst.appendChild(e);
      return;
    }
    list.forEach(d => {
      const it = document.createElement('div');
      it.className = 'doc-item' + (curDoc === d.doc_key ? ' active' : '');
      it.dataset.key = d.doc_key;
      const name = document.createElement('span');
      name.textContent = d.title || '(未命名)';
      name.title = d.updated_at ? '更新于 ' + String(d.updated_at).replace('T', ' ').slice(0, 16) : '';
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕'; del.title = '删除白板';
      del.onclick = async ev => {
        ev.stopPropagation();
        if (!confirm('删除白板「' + (d.title || '') + '」？协作数据将一并清除。')) return;
        await api('/api/docs/' + d.doc_key, { method: 'DELETE' });
        if (curDoc === d.doc_key) curDoc = null;
        await refreshBoard();
      };
      it.append(name, del);
      it.onclick = () => { if (curDoc !== d.doc_key) connect(d.doc_key); };
      lst.appendChild(it);
    });
    if (!curDoc && list.length) connect(list[0].doc_key);
  } catch (e) {}
}
async function newBoard() {
  const t = prompt('新白板名称', '白板 ' + new Date().toLocaleTimeString().slice(0,5));
  if (t === null) return;
  const r = await api('/api/docs', { method:'POST', body: JSON.stringify({ title: t, kind: 'board' }) });
  const d = await r.json();
  await refreshBoard();
  connect(d.docKey);
}


/* ============ 历史 / 恢复 ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function showHistory() {
  if (!curDoc) { alert('请先打开一份白板'); return; }
  const h = await (await api('/api/docs/' + curDoc + '/history')).json();
  const mask = document.createElement('div');
  mask.className = 'histMask';
  mask.style.cssText = 'position:fixed; inset:0; background:rgba(20,25,35,.55); display:flex; align-items:center; justify-content:center; z-index:99;';
  mask.onclick = ev => { if (ev.target === mask) mask.remove(); };
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--card); border-radius:14px; padding:18px 22px; width:620px; max-width:92vw; max-height:74vh; overflow:auto; font-size:13px; box-shadow:var(--deep, 0 12px 40px rgba(0,0,0,.3));';
  box.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px"><b style="font-size:15px">📜 版本历史 · 当前 rev=' + h.rev + '</b><button class="btn" onclick="this.closest(\'.histMask\').remove()">✕ 关闭</button></div>';
  const list = document.createElement('div');
  (h.ops || []).forEach(o => {
    const row = document.createElement('div');
    row.style.cssText = 'padding:7px 8px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px;';
    row.innerHTML = '<b>#' + o.seq + '</b><span class="so">' + esc(String(o.created_at || '').replace('T',' ').slice(0,16)) + '</span><span class="so">' + esc(String(o.element_id || '').slice(0,10)) + '.' + esc(o.field || '∅') + '</span><span style="flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(String(o.value_json || '').replace(/^"|"$/g,'').slice(0,36)) + '</span><button class="btn" style="padding:1px 10px" onclick="restoreRev(' + o.seq + ')">恢复</button>';
    list.appendChild(row);
  });
  if (!h.ops || !h.ops.length) list.innerHTML = '<div class="so">暂无操作记录</div>';
  box.appendChild(list);
  mask.appendChild(box);
  document.body.appendChild(mask);
}
async function restoreRev(rev) {
  if (!confirm('恢复到 rev ' + rev + '？当前内容将被覆盖（在线成员实时看到变化）。')) return;
  try {
    const r = await fetch('/api/docs/' + curDoc + '/restore', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + window.auth.token() }, body: JSON.stringify({ rev }) });
    const j = await r.json();
    alert(j.msg || ('已恢复到 rev ' + rev));
    document.querySelectorAll('.histMask').forEach(d => d.remove());
  } catch (e) { alert('恢复失败: ' + e); }
}
/* boot */
$('meTag').textContent = '本机 ' + me.slice(0, 6);
refreshBoard();
const q = new URLSearchParams(location.search).get('doc');
if (q) connect(q);
console.log('board ready');
</script>
</main>
<script>

/* 底部账号键：未登录 → 登录页；已登录 → 用户菜单（资料入口/退出） */
(function () {
  const ru = document.getElementById('railUser');
  if (!ru || !window.auth) return;
  const esc2 = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const user = window.auth.user() || {};
  if (!window.auth.token() || !user || !user.username) { return; }
  ru.setAttribute('href', 'javascript:void(0)');
  ru.title = '账号：' + (user.nickname || user.username);
  const close = () => document.querySelectorAll('.railmenu').forEach(x => x.remove());
  const open = ev => {
    ev.preventDefault();
    const exist = document.querySelector('.railmenu');
    if (exist) { close(); return; }
    const m = document.createElement('div');
    m.className = 'railmenu';
    m.innerHTML = '<div class="rm-head"><span class="rm-avatar">' + esc2((user.nickname || user.username || '?').slice(0, 1).toUpperCase()) + '</span>'
      + '<div><div class="rm-name">' + esc2(user.nickname || user.username) + '</div>'
      + '<div class="rm-sub">@' + esc2(user.username) + ' · ' + esc2(user.role || 'editor') + '</div></div></div>'
      + '<div class="rm-item">我的资料</div>'
      + '<div class="rm-item danger">退出登录</div>';
    const done = () => { close(); document.removeEventListener('click', done); };
    m.addEventListener('click', ev2 => ev2.stopPropagation());
    setTimeout(() => document.addEventListener('click', done), 0);
    m.querySelectorAll('.rm-item')[0].onclick = () => { close(); document.removeEventListener('click', done); location.href = '/?profile=1'; };
    m.querySelectorAll('.rm-item')[1].onclick = () => { close(); document.removeEventListener('click', done); window.auth.clear(); location.href = '/login.html'; };
    document.body.appendChild(m);
  };
  ru.onclick = open;
})();

</script>
