<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>协同工作台 · 文档</title>
<script src="/auth.js"></script>
<style>
:root {
    --bg:#f7f6f3; --card:#ffffff; --line:rgba(20,18,14,.09);
    --ink:rgba(30,27,24,.92); --mut:#6f6960; --mutl:#a39e96;
    --acc:#0a6cda; --acc2:#005bb5; --accbg:#f2f8ff; --ok:#1e9e58;
    --shadow: rgba(30,27,20,.05) 0px 4px 18px, rgba(30,27,20,.035) 0px 2px 7.8px,
              rgba(30,27,20,.025) 0px .8px 2.9px, rgba(30,27,20,.02) 0px .2px 1px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
           padding:9px 20px; background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
           border-bottom:1px solid var(--line); }
  header .brand { display:flex; align-items:center; gap:8px; margin-right:6px; }
  header .brand .logo { width:26px; height:26px; border-radius:7px; background:var(--acc); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  header .brand a { color:var(--mut); text-decoration:none; font-size:12.5px; margin-left:2px; }
  header .brand a:hover { color:var(--acc); }
  header h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:-.2px; }
  .tag { font-size:12.5px; color:var(--mut); }
  .btn { border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 12px;
         cursor:pointer; font-size:13px; transition:all .15s; color:var(--ink); }
  .btn:hover { border-color:var(--acc); color:var(--acc); }
  .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .btn.primary:hover { background:var(--acc2); color:#fff; }
  #wrap { display:flex; height:calc(100vh - 49px); }
  #side { width:264px; border-right:1px solid var(--line); background:var(--card);
          overflow:auto; padding:14px; }
  #side h2 { font-size:12px; color:var(--mutl); margin:0 0 8px; font-weight:600; letter-spacing:.4px; }
  .doc-item { padding:7px 10px; border-radius:7px; cursor:pointer; display:flex;
              justify-content:space-between; align-items:center; gap:6px; font-size:13.5px; }
  .doc-item:hover { background:var(--bg); }
  .doc-item.active { background:var(--accbg); color:var(--acc); font-weight:600; }
  .doc-item .del { visibility:hidden; border:0; background:none; color:var(--mutl);
                   cursor:pointer; font-size:15px; padding:0 2px; }
  .doc-item:hover .del { visibility:visible; }
  .doc-item .del:hover { color:#e5484d; }
  #main { flex:1; overflow:auto; padding:30px 18px; background:#f7f6f3; }
  #editor { max-width:760px; margin:0 auto; background:var(--card); border:1px solid var(--line);
            border-radius:12px; padding:38px 48px; min-height:calc(100vh - 110px);
            box-shadow:var(--shadow); }
  #title { font-size:28px; font-weight:700; letter-spacing:-.4px; line-height:1.4; outline:none; margin-bottom:18px;
           min-height:42px; }
  #title:empty::before, .seg:empty::before { content:attr(data-ph); color:var(--mutl); }
  .seg { outline:none; font-size:16px; line-height:1.95; min-height:1.9em; padding:2px 2px;
         border-radius:3px; transition:box-shadow .15s; }
  .seg:focus { box-shadow:0 1.5px 0 0 var(--acc); }
  #status { position:fixed; right:16px; bottom:12px; font-size:12px; color:var(--mut);
            background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:999px;
            padding:5px 12px; box-shadow:var(--shadow); }
  #log { position:fixed; left:16px; bottom:12px; font-size:11px; color:#98938b; max-width:380px;
         max-height:70px; overflow:auto; background:rgba(255,255,255,.93); border:1px solid var(--line);
         border-radius:9px; padding:4px 10px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.on { background:var(--ok); } .dot.off { background:#e5484d; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">协</span><a href="/">← 首页</a></div>
  <h1>协同文档</h1>
  <button class="btn primary" onclick="newDoc()">＋ 新建文档</button>
  <button class="btn" onclick="showHistory()" title="版本历史：时间线回放与恢复">📜 历史</button>
  <button class="btn" onclick="exportMd()" title="导出为 Markdown">⬇ 导出</button>
  <span class="tag" id="meTag" style="margin-left:auto"></span>
</header>
<div id="wrap">
  <aside id="side">
    <h2>文档列表</h2>
    <div id="docList"></div>
  </aside>
  <main id="main">
    <div id="editor" style="display:none">
      <div id="title" contenteditable="true" data-ph="（点击输入标题）" spellcheck="false"></div>
      <div id="segs"></div>
    </div>
    <div id="emptyTip" style="display:none;color:var(--mut);text-align:center;padding:90px 0">
      从左侧选择或新建一个文档
    </div>
  </main>
</div>
<div id="status"><span class="dot off" id="dot"></span><span id="statText">未连接</span></div>
<div id="log"></div>

<script>
'use strict';
window.auth.guard();
/* REST 统一带 JWT */
const api = (url, opt = {}) => fetch(url, {
  ...opt,
  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + window.auth.token(), ...(opt.headers || {}) },
});
/* ================= 顶层状态 ================= */
const me = 'c' + Math.random().toString(36).slice(2, 9);
let ws = null, rev = 0, curDoc = null;
let lamport = 0;                                   // 本地 Lamport 计数器
const segs = new Map();                            // eid -> { order, el }
const clock = () => `${me}:${++lamport}`;
const $ = id => document.getElementById(id);
const log = s => { $('log').textContent += '> ' + s + '\n'; $('log').scrollTop = 1e9; };
const stat = s => $('statText').textContent = s;
const setDot = on => $('dot').className = 'dot ' + (on ? 'on' : 'off');

/* ================= WebSocket ================= */
function connect(docKey) {
  if (ws) { ws.onclose = null; ws.close(); }
  curDoc = docKey;
  rev = 0;
  segs.clear();
  $('segs').innerHTML = '';
  $('title').textContent = '';
  $('editor').style.display = '';
  $('emptyTip').style.display = 'none';
  refreshDocs();
  ws = new WebSocket(window.auth.wsUrl('/ws/collab'));
  ws.onopen = () => { send({ type: 'hello', docId: curDoc, clientId: me, hostname: 'editor', lastRev: 0 }); };
  ws.onmessage = ev => { try { onMsg(JSON.parse(ev.data)); } catch (e) { log('坏帧: ' + ev.data); } };
  ws.onclose = () => { setDot(false); stat('已断开'); };
  ws.onerror = () => log('连接错误');
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function onMsg(m) {
  switch (m.type) {
    case 'welcome':
      setDot(true);
      renderSnapshot(m.snapshot || []);
      rev = m.rev;
      stat('已连接 rev=' + rev);
      break;
    case 'incremental':
      (m.ops || []).forEach(o => { applyRemote(o); });
      rev = m.rev;
      stat('增量补发 ' + (m.ops || []).length + ' 条');
      break;
    case 'applied':
      rev = m.rev;
      // 自己的 op 也做本地镜像（DELETE 本地移除；PUT/ADD 幂等）
      applyRemote(m.op);
      break;
    case 'presence':
      stat('rev=' + rev + ' · 在线 ' + (m.members || []).length + ' 人');
      break;
  }
}

/* ================= 渲染 ================= */
function renderSnapshot(snap) {
  const els = (snap || []).map(el => ({ ...el, fields: unpack(el.fields || {}) })).sort(byOrder);
  els.forEach(el => {
    if (el.id === 'doc-root') {
      $('title').textContent = (el.fields && el.fields.title) || '';
    } else if (el.type === 'TEXT') {
      addSegDom(el.id, el.fields);
    }
  });
  refreshDocs();
}
// 快照字段形态：name -> {value, clock}（对齐协议规范）
function unpack(fields) {
  const out = {};
  Object.entries(fields).forEach(([k, v]) => { out[k] = v && typeof v === 'object' && 'value' in v ? v.value : v; });
  return out;
}
function byOrder(a, b) {
  const oa = (a.fields && a.fields.order != null) ? +a.fields.order : 0;
  const ob = (b.fields && b.fields.order != null) ? +b.fields.order : 0;
  return oa - ob || (a.id < b.id ? -1 : 1);
}
function addSegDom(eid, fields) {
  let d = document.querySelector('#segs [data-eid="' + eid + '"]');
  const text = fields.text != null ? String(fields.text) : '';
  if (!d) {
    d = document.createElement('div');
    d.className = 'seg';
    d.contentEditable = true;
    d.dataset.eid = eid;
    d.dataset.ph = '（输入文字 · Enter 分段 · Backspace 删空段）';
    d.spellcheck = false;
    bindSeg(d);
    $('segs').appendChild(d);
  }
  if (document.activeElement !== d && d.textContent !== text) d.textContent = text;
  d.dataset.order = fields.order != null ? fields.order : 0;
  segs.set(eid, { order: fields.order != null ? +fields.order : 0, el: d });
  return d;
}

/* ================= 段落事件 ================= */
function bindSeg(d) {
  let composing = false, timer = null;
  const flush = () => {
    clearTimeout(timer);
    timer = setTimeout(() => sendPut(d.dataset.eid, 'text', d.textContent), 200);
  };
  d.addEventListener('compositionstart', () => composing = true);
  d.addEventListener('compositionend', () => { composing = false; flush(); });
  d.addEventListener('input', () => { if (!composing) flush(); });
  d.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      splitSeg(d);
    } else if (ev.key === 'Backspace' && d.textContent === '' && segs.size > 1) {
      ev.preventDefault();
      deleteSeg(d);
    }
  });
}

/* Enter：在光标处把段一分为二 */
function splitSeg(d) {
  const eid = d.dataset.eid;
  const text = d.textContent;
  const caret = getCaret(d);
  const left = text.slice(0, caret);
  const right = text.slice(caret);
  d.textContent = left;
  sendPut(eid, 'text', left);
  const newId = 'seg-' + Math.random().toString(36).slice(2, 10);
  const order = nextOrder(d);
  send({ type: 'op', docId: curDoc, clientId: me, baseRev: rev,
         op: { type: 'ADD', elementId: newId, elementType: 'TEXT', clock: clock() } });
  send({ type: 'op', docId: curDoc, clientId: me, baseRev: rev,
         op: { type: 'PUT', elementId: newId, elementType: 'TEXT', field: 'order', value: order, clock: clock() } });
  sendPut(newId, 'text', right);
  const nd = addSegDom(newId, { order, text: right });
  reorderDom();
  nd.focus();
  placeCaret(nd, 0);
}

/* ---------- 删除空段 ---------- */
function deleteSeg(d) {
  const eid = d.dataset.eid;
  send({ type: 'op', docId: curDoc, clientId: me, baseRev: rev,
         op: { type: 'DELETE', elementId: eid, elementType: 'TEXT', clock: clock() } });
  d.remove();
  segs.delete(eid);
  const prev = d.previousElementSibling;
  if (prev) { prev.focus(); placeCaret(prev, prev.textContent.length); }
}

/* ---------- 段落排序（有理数 order）---------- */
function nextOrder(d) {
  const idx = [...$('segs').children].indexOf(d);
  const kids = [...$('segs').children];
  const prev = idx - 1 >= 0 ? +(kids[idx - 1].dataset.order || 0) : 0;
  const next = idx + 1 < kids.length ? +(kids[idx + 1].dataset.order || 0) : null;
  return next == null ? prev + 1 : (prev + next) / 2;
}
function reorderDom() {
  [...segs.entries()]
    .sort((a, b) => a[1].order - b[1].order || (a[0] < b[0] ? -1 : 1))
    .forEach(([eid]) => { const { el } = segs.get(eid); el.remove(); $('segs').appendChild(el); });
}

/* ================= 发送 op ================= */
function sendPut(eid, field, value) {
  send({ type: 'op', docId: curDoc, clientId: me, baseRev: rev,
         op: { type: 'PUT', elementId: eid, elementType: 'TEXT', field, value, clock: clock() } });
}

/* ================= 远端 op ================= */
function applyRemote(op) {
  if (op.type === 'DELETE') { deleteEl(op.elementId); return; }
  if (op.type === 'ADD') { addSegDom(op.elementId, {}); return; }
  if (op.type === 'PUT') {
    if (op.elementId === 'doc-root') {
      if (op.field === 'title' && document.activeElement !== $('title')) $('title').textContent = op.value;
      return;
    }
    const rec = segs.get(op.elementId);
    if (!rec) return;
    if (op.field === 'text') {
      const el = rec.el;
      if (el === document.activeElement) keepCaret(el, el.textContent, op.value);
      else el.textContent = op.value;
    } else if (op.field === 'order') {
      rec.order = +op.value;
      rec.el.dataset.order = op.value;
      reorderDom();
    }
  }
}
function segEl(eid) { return segs.get(eid) ? segs.get(eid).el : null; }
function deleteEl(eid) { const s = segs.get(eid); if (s) { s.el.remove(); segs.delete(eid); } }
function keepCaret(el, oldText, newText) {
  const oldlen = oldText.length, nlen = newText.length;
  let pre = 0;
  while (pre < Math.min(oldlen, nlen) && oldText[pre] === newText[pre]) pre++;
  let suf = 0;
  while (suf < Math.min(oldlen - pre, nlen - pre)
         && oldText[oldlen - 1 - suf] === newText[nlen - 1 - suf]) suf++;
  const pos = getCaret(el);
  el.textContent = newText;
  placeCaret(el, Math.max(pre, Math.min(nlen - suf, pos)));
}

/* ================= caret 工具 ================= */
function getCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return 0;
  const r = sel.getRangeAt(0);
  if (r.startContainer === el) return r.startOffset;
  if (r.startContainer.nodeType === 3) { const t = r.startContainer.nodeValue || ''; return Math.min(r.startOffset, t.length); }
  return 0;
}
function placeCaret(el, pos) {
  const node = el.firstChild && el.firstChild.nodeType === 3 ? el.firstChild : el;
  const len = node.nodeType === 3 ? (node.nodeValue || '').length : 0;
  const range = document.createRange();
  range.setStart(node, Math.min(pos, len));
  range.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/* ================= 标题 ================= */
let titleTimer = null;
$('title').addEventListener('input', () => {
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => {
    send({ type: 'op', docId: curDoc, clientId: me, baseRev: rev,
           op: { type: 'PUT', elementId: 'doc-root', elementType: 'DOC', field: 'title',
                 value: $('title').textContent, clock: clock() } });
  }, 300);
});

/* ================= REST：文档 CRUD ================= */
async function refreshDocs() {
  try {
    const sp = sessionStorage.getItem('collab_space');
    const r = await api(sp ? '/api/docs?spaceId=' + sp : '/api/docs');
    const list = await r.json();
    $('docList').innerHTML = '';
    list.forEach(doc => {
      const it = document.createElement('div');
      it.className = 'doc-item' + (doc.doc_key === curDoc ? ' active' : '');
      const nm = document.createElement('span');
      nm.textContent = doc.title && doc.title !== doc.doc_key ? doc.title : '(未命名 ' + doc.doc_key.slice(0, 8) + ')';
      nm.className = 'name';
      nm.onclick = () => connect(doc.doc_key);
      it.appendChild(nm);
      const del = document.createElement('button');
      del.textContent = '✕'; del.className = 'del';
      del.title = '删除文档与全部内容';
      del.onclick = async ev => {
        ev.stopPropagation();
        if (!confirm('删除该文档及其全部协同数据？')) return;
        await api('/api/docs/' + doc.doc_key, { method: 'DELETE' });
        if (curDoc === doc.doc_key) showEmpty();
        refreshDocs();
      };
      it.appendChild(del);
      $('docList').appendChild(it);
    });
  } catch (e) { log('REST 列表失败: ' + e); }
}
function newDoc() {
  const t = prompt('新文档标题', '新建文档');
  if (t === null) return;
  api('/api/docs', { method: 'POST', body: JSON.stringify({ title: t }) })
    .then(r => r.json())
    .then(d => { refreshDocs(); connect(d.docKey); });
}
function showEmpty() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  curDoc = null;
  $('editor').style.display = 'none';
  $('emptyTip').style.display = '';
  refreshDocs();
}

/* ================= boot ================= */
const bootQ = new URLSearchParams(location.search).get('doc');
$('meTag').textContent = '本端 ' + me.slice(0, 6);
refreshDocs();
log('编辑器就绪，请登录后新建或打开文档');
if (bootQ) connect(bootQ);

/* ================= 历史/导出（T0+10） ================= */
function showHistory() {
  if (!curDoc) { log('请先打开一个文档'); return; }
  api('/api/docs/' + curDoc + '/history').then(r => r.json()).then(h => {
    const box = document.createElement('div');
    box.id = 'histBox';
    box.style.cssText = 'position:fixed; inset:0; background:rgba(20,25,35,.55); display:flex; align-items:center; justify-content:center; z-index:99;';
    box.innerHTML = '<div style="background:#fff; border-radius:12px; padding:18px 22px; width:600px; max-height:72vh; overflow:auto; font-size:13px;">'
      + '<div style="display:flex; justify-content:space-between; margin-bottom:10px;">'
      + '<b>📜 版本历史 · 当前 rev=' + h.rev + '</b>'
      + '<button class="btn" onclick="document.getElementById(\'histBox\').remove()">✕ 关闭</button></div>'
      + (h.ops && h.ops.length
          ? h.ops.map(o => histItem(o)).join('')
          : '<div class="so">暂无操作记录</div>')
      + '</div>';
    document.body.appendChild(box);
  }).catch(e => log('历史加载失败: ' + e));
}
function histItem(o) {
  const t = String((o.value_json || '').replace(/^"|"$/g, ''));
  return '<div style="padding:7px 8px; border-bottom:1px solid #f0f3f4;">'
    + '<b>#' + o.seq + '</b> <span class="so">' + String(o.created_at || '').replace('T', ' ').slice(0, 16)
    + '</span> · <span class="so">' + String(o.element_id || '').slice(0, 12) + '.' + (o.field || '∅')
    + '</span> = ' + (t.slice(0, 42) || '∅')
    + ' <button class="btn" style="padding:1px 9px;" onclick="restoreRev(' + o.seq + ')">恢复到此</button>'
    + '</div>';
}
async function restoreRev(rev) {
  if (!confirm('恢复到 rev ' + rev + '？当前内容将被覆盖（在线成员实时看到变化）。')) return;
  try {
    const r = await api('/api/docs/' + curDoc + '/restore', { method: 'POST', body: JSON.stringify({ rev }) });
    const j = await r.json();
    const bx = document.getElementById('histBox'); if (bx) bx.remove();
    alert(j.msg || '恢复完成 (diff ' + (j.ops || 0) + ' ops)');
  } catch (e) { log('恢复失败: ' + e); }
}
function exportMd() {
  if (!curDoc) { alert('请先打开一个文档'); return; }
  api('/api/docs/' + curDoc + '/export').then(async r => {
    if (!r.ok) { log('导出失败 HTTP ' + r.status); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'doc-' + curDoc.slice(0, 8) + '.md';
    a.click();
    log('✅ 已导出 Markdown');
  });
}
</script>
</body>
</html>
